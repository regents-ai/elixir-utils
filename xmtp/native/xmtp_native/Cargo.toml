[package]
name = "xmtp_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
base64 = "0.22"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xmtp = { version = "0.9.3", features = ["alloy"] }

[profile.release]
codegen-units = 1
strip = "symbols"
